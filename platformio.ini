; Two firmwares live in this tree, one env each. `build_src_filter` REPLACES
; PlatformIO's default `+<*>`, so each env compiles exactly one main.
;
;   cycluno -> src/main.cpp   the deck: SPI TFT + framed v2 protocol (docs/WIRING.md)
;   mouse   -> src/mouse.cpp  standalone HID mouse + MPU6050 (docs/WIRING-MOUSE.md)
;
; The deck is what aion talks to: only main.cpp speaks the CRC framing pinned
; to aion/src/aion/deck/protocol.py. `make test` gates that it still does.

[env:cycluno]
platform = atmelavr
board = uno
framework = arduino
build_src_filter = +<main.cpp>
build_flags = -Iinclude
lib_deps =
  adafruit/Adafruit GFX Library@^1.11
  adafruit/Adafruit ST7735 and ST7789 Library@^1.10

[env:mouse]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_src_filter = +<mouse.cpp>

[env:diag]
platform = atmelavr
board = uno
framework = arduino
build_src_filter = +<diag.cpp>

[env:test_serial]
platform = atmelavr
board = uno
framework = arduino
build_src_filter = +<test_serial.cpp>

[env:test_mpu]
platform = atmelavr
board = uno
framework = arduino
board_build.mcu = atmega328p
board_build.f_cpu = 16000000L
monitor_speed = 115200
build_src_filter = +<test_mpu.cpp>
